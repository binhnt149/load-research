name: Windows preview release

on:
  push:
    branches: ['windows-preview/**']

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            packaging/requirements-build.txt
      - name: Read version and install locked dependencies
        id: metadata
        shell: bash
        run: |
          version="$(python packaging/release_tools.py version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python -m pip install -r requirements.lock
          python -m pip install -r packaging/requirements-build.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-v1-windows-x64-${{ hashFiles('requirements.lock', 'packaging/requirements-build.txt') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            nuitka-v1-windows-x64-${{ hashFiles('requirements.lock', 'packaging/requirements-build.txt') }}-
      - name: Compile standalone Windows application
        working-directory: packaging
        shell: bash
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: >-
          pyside6-deploy -c pysidedeploy.spec --mode standalone --no-install
          --extra-ignore-dirs=.git,.venv,tests,docs,research-projects,benchmark-data,build,dist
      - name: Create portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path dist/native/LoadResearch.dist -DestinationPath "dist/release/LoadResearch-$env:VERSION-windows-x64.zip"
      - name: Publish Windows pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          cd dist/release
          sha256sum "LoadResearch-$VERSION-windows-x64.zip" > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Bản Windows x64 thử nghiệm: giải nén ZIP, chạy LoadResearch.dist/launcher.exe và giữ nguyên cả thư mục.

          Bản này sửa lỗi xung đột thời điểm MDMS, ưu tiên bản ghi gần đầu chu kỳ và lưu nhật ký; bổ sung nghiên cứu theo nhóm sản lượng A–E và ước phân bổ thương phẩm theo bảng cấu hình.

          Trước khi chuẩn bị phát hành, 423 kiểm thử trên máy phát triển macOS đạt và đã chạy thành công một tháng dữ liệu thực. Để phát hành nhanh, lượt này không chạy lại full suite, audit phụ thuộc, smoke executable hay kiểm tra cửa sổ console Windows; không build macOS. Chưa nghiệm thu bản cài Windows trên máy sạch hoặc quy mô 7.000 khách hàng × 12 tháng. Windows chưa ký Authenticode.
          NOTES
          gh release create "v$VERSION" "LoadResearch-$VERSION-windows-x64.zip" SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --title "Load Research Desktop $VERSION — Windows thử nghiệm" \
            --notes-file release-notes.md
      - name: Keep Windows package if publishing fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64-unpublished
          path: dist/release/
          if-no-files-found: ignore
          retention-days: 3
