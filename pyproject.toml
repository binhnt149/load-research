[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "load-research"
version = "0.1.3"
description = "Local desktop electricity load research with reproducible class profiles"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7", "duckdb>=1.4,<3", "numpy>=2,<3", "pyarrow>=20,<30",
  "scikit-learn>=1.7,<2", "matplotlib>=3.9,<4", "openpyxl>=3.1,<4",
  "XlsxWriter>=3.2,<4", "psutil>=6,<8", "tzdata>=2025.1,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4,<5", "ruff>=0.11,<1", "mypy>=1.15,<3", "build>=1,<2", "pip-tools>=7,<9", "pip-audit>=2,<3"]

[project.scripts]
load-research = "load_research.__main__:main"

[project.urls]
Repository = "https://github.com/binhnt149/load-research"
Issues = "https://github.com/binhnt149/load-research/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
addopts = "-ra --strict-markers"
markers = ["performance: bounded resource tests; full-size benchmark is an explicit CLI command"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
